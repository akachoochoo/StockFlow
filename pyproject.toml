[project]
name = "sevensplit"
version = "0.1.0"
description = "Seven Split + AI Circuit Breaker based multi-asset trading system"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SevenSplit" }
]
dependencies = [
    "pydantic>=2.0",
    "click>=8.1",
    "pyyaml>=6.0",
    # pykrx provides KRX OHLCV download for Phase 0 retrospective + Phase 1
    # transition. Phase 1 will swap to KIS API but we keep pykrx as the
    # offline-replay data source.
    "pykrx>=1.0.45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "freezegun>=1.4",
    "ruff>=0.4.0",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
trading = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
]
markers = [
    "unit: unit tests (no I/O)",
    "integration: integration tests (DB, file system)",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    # Protocol method body that is just `...`
    "^\\s*\\.\\.\\.\\s*$",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "RUF", # ruff-specific
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "N802"]
"src/domain/**/*.py" = []

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ---------------------------------------------------------------------------
# mypy: domain strict, adapters progressive
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true
pretty = true

# Domain layer: strict
# Note: `disallow_any_explicit` is intentionally NOT enabled. It triggers on
# every `class X(BaseModel)` because pydantic's inherited classmethods
# (model_validate, etc.) carry `Any` in their signatures. The remaining strict
# options still catch unannotated defs, untyped calls, and implicit Any.
[[tool.mypy.overrides]]
module = "src.domain.*"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true

# Ports: strict (Protocol definitions)
[[tool.mypy.overrides]]
module = "src.ports.*"
strict = true
disallow_untyped_defs = true

# Use cases: strict
[[tool.mypy.overrides]]
module = "src.use_cases.*"
strict = true

# Adapters: progressive (외부 라이브러리 타입 누락 허용)
[[tool.mypy.overrides]]
module = "src.adapters.*"
disallow_untyped_defs = false
ignore_missing_imports = true

# Infrastructure: progressive
[[tool.mypy.overrides]]
module = "src.infrastructure.*"
disallow_untyped_defs = false
ignore_missing_imports = true

# Tests: relaxed
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false
