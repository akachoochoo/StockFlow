# Phase 0.5 strategy config — Policy D-2 (MovingAverageReentry).
#
# ADR 0002 §4.1.1: original "Policy D" (CurrentMarketReentry) was deprecated
# during 4차 검토 because its self-referential trigger
# (current_price <= current_price * 0.95) is structurally unfirable. D-2
# replaces it with an N-day moving-average anchor — the same drop_pct
# threshold but applied against the SMA of the last `window` trading bars
# (look-ahead-safe, end-exclusive — ADR §4.10).
#
# Filename retains "D" so ADR §8.2 / §8.4 D-vs-F comparison commands
# remain stable across the historical record.
#
# Same per_split_amount / drop_threshold_pct / profit_target_pct as
# strategies-F.yaml — the only difference is the reentry policy. This is
# the controlled-experiment principle from ADR §1.3 (one variable at a
# time). The 5-year KOSPI 200 backtest comparing D vs F lives in step
# 0.5.24 / 0.5.25; the analysis script lives in step 0.5.26.

version: "0.5"
assets:
  "069500":
    name: "KODEX 200"
    enabled: true

    buy_strategy: "price_drop"
    buy_parameters:
      drop_threshold_pct: 5.0
      max_split_count: 7
      per_split_amount: 10000000
      max_split_per_day: 1

    sell_strategy: "profit_target"
    sell_parameters:
      profit_target_pct: 10.0
      max_sells_per_day: 7

    reentry_strategy: "moving_average"
    reentry_parameters:
      window: 20
      ma_type: "sma"
