# config/assets.yaml — 데이터 주도 자산 메타데이터 레지스트리 (Phase 1.1, ADR 0021)
#
# composition.asset_from_code 의 **단일 정본**. Phase 0 박제 9 종 포함 모든
# 종목을 여기서 로드 (ADR 0021 §7.1 통합 — 하드코딩 _ASSET_FACTORIES 제거).
# 새 종목은 코드 수정 없이 이 파일에 추가하면 거래 대상이 된다.
#
# 관리 도구: scripts/manage_strategies.py
#   - add  : strategies*.yaml(전략) + assets.yaml(메타데이터) 동시 갱신
#            + pykrx 교차검증 (종목명 / 시장 / 데이터 가용성)
#   - list / show / validate / enable / disable / remove / set / new / diff
#
# 직접 편집도 가능. 단 money-critical 필드(tick_size / listed_at)는 KRX/DART
# 공식 자료로 확인할 것 (CLAUDE.md §5.1 "외부 데이터는 검증 후 도메인 진입").
#
# 필드:
#   name        : 종목명 (필수)
#   market      : KOSPI | KOSDAQ (필수)
#   asset_class : KR_ETF | KR_STOCK (필수)
#   listed_at   : 상장일 YYYY-MM-DD (필수 — 5년 백테스트 가용성·tradeable 기준)
#   tick_size   : 호가단위 (옵션 — 기본 KR_ETF=5 / KR_STOCK=1)
#   lot_size    : 매매단위 (옵션 — 기본 1)
#   exchange    : KRX (옵션 — 기본 KRX)
#   currency    : KRW (옵션 — 기본 KRW)
#   delisted_at : 상장폐지일 YYYY-MM-DD (옵션)
#
# 아래 9 종 = Phase 0 박제 (ADR 0005 §1.6.2 / §1.7 / §3.3.1). tick_size 는
# 클래스 기본값과 동일하여 생략 (KR_ETF=5 / KR_STOCK=1). listed_at = KRX 공식.
